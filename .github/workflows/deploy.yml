name: Deploy Frontend to Azure

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload to Blob Storage
        run: |
          az storage blob upload-batch \
            --account-name amamecharesume2026 \
            --destination '$web' \
            --source . \
            --pattern "*.html" \
            --overwrite
          az storage blob upload-batch \
            --account-name amamecharesume2026 \
            --destination '$web' \
            --source . \
            --pattern "*.css" \
            --overwrite
          az storage blob upload-batch \
            --account-name amamecharesume2026 \
            --destination '$web' \
            --source . \
            --pattern "*.js" \
            --overwrite